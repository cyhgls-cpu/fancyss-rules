name: Build fancyss rules

on:
  schedule:
    # 每天 UTC 16:10 = 北京时间 00:10 运行
    - cron: "10 16 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/build_rules.sh"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build rules
        run: |
          bash scripts/build_rules.sh rules_ng

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules_ng/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update rules: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
